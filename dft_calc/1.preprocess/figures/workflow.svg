<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#556579"/></marker></defs><rect width="1200" height="620" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#172b44}.title{font-size:26px;font-weight:bold}.label{font-size:17px;font-weight:bold}.body{font-size:15px}.arrow{fill:none;stroke:#556579;stroke-width:2;marker-end:url(#arrow)}</style><text x="34" y="43" class="title">One example, two paths: reference and prediction</text><text x="34" y="73" class="body">The reference density is used to measure error; only the three feature grids enter the network.</text><rect x="35" y="110" width="235" height="115" rx="12" fill="#e5eef9" stroke="#afbdd0"/><text x="51" y="140" class="label">Structure + setup</text><text x="51" y="167" class="body">STRUCT.fdf · pseudopotentials</text><text x="51" y="189" class="body">20 Å cell · 80³ mesh · PBE</text><rect x="325" y="110" width="240" height="115" rx="12" fill="#e5eef9" stroke="#afbdd0"/><text x="341" y="140" class="label">Reference SCF</text><text x="341" y="167" class="body">Iterate to self-consistency</text><text x="341" y="189" class="body">Write target and feature grids</text><rect x="630" y="110" width="240" height="115" rx="12" fill="#e4f2e9" stroke="#afbdd0"/><text x="646" y="140" class="label">Reference density</text><text x="646" y="167" class="body">Molecular.RHO</text><text x="646" y="189" class="body">Used as HDF5 target</text><rect x="325" y="285" width="240" height="140" rx="12" fill="#e5eef9" stroke="#afbdd0"/><text x="341" y="315" class="label">Three feature grids</text><text x="341" y="342" class="body">Molecular.IOCH</text><text x="341" y="364" class="body">rhoatom (atomic baseline)</text><text x="341" y="386" class="body">rhoover (orbital overlap)</text><rect x="630" y="285" width="240" height="140" rx="12" fill="#e5eef9" stroke="#afbdd0"/><text x="646" y="315" class="label">Preprocess + DeepSCF</text><text x="646" y="342" class="body">Use fixed Original-model scale</text><text x="646" y="364" class="body">Input: 3 × 80 × 80 × 80</text><text x="646" y="386" class="body">Output: predict/0001.RHO</text><rect x="930" y="285" width="235" height="140" rx="12" fill="#e5eef9" stroke="#afbdd0"/><text x="946" y="315" class="label">One-step non-SCF</text><text x="946" y="342" class="body">Prediction copied as In.RHO</text><text x="946" y="364" class="body">Read charge; one iteration</text><text x="946" y="386" class="body">Energy · eigenvalues · forces</text><rect x="630" y="485" width="535" height="85" rx="12" fill="#fff0d9" stroke="#afbdd0"/><text x="646" y="515" class="label">Compare against the reference</text><text x="646" y="542" class="body">Density error and electronic observables; not a speedup benchmark.</text><path d="M270 166 H325" class="arrow"/><path d="M565 166 H630" class="arrow"/><path d="M445 225 V285" class="arrow"/><path d="M565 355 H630" class="arrow"/><path d="M870 355 H930" class="arrow"/><path d="M750 225 V260 H895 V460 H790 V485" class="arrow"/><path d="M750 425 V485" class="arrow"/><path d="M1048 425 V485" class="arrow"/><text x="886" y="246" class="body">Evaluation only</text><text x="35" y="605" class="body">All run stages retain the same cell, mesh, structure and electronic-structure settings.</text></svg>