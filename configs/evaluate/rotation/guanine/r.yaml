# @package _global_

hydra:
  run:
    dir: './results/evaluate/rotation/guanine/r'

gpu: 1

load:
  model: 'pretrained/r/model.pt'

model:
  mean: 0.000703515184088
  std: 0.011004881409448
  input_layers: 3
  layers: 32
  residual: true
  kernal_size: 5
  activation_function: 'ReLU'
  pooling_method: 'max'
  normalization: true

target:
  path: 'datasets/evaluation/rotation/guanine/r'
