# @package _global_

hydra:
  run:
    dir: './results/train/r_plus_s_x2'

gpu: 0

dataset:
  path: 'datasets/train/r_plus_s_x2'
  use_cache: false
  cache_size: 'max'
  augmentation: 2
  batch_size: 1
  ratio: 0.8
  seed: 10

dataloader:
  num_workers: 3
  pin_memory: true

model:
  mean: 0.000703763851020
  std: 0.011012697476023
  input_layers: 3
  layers: 32
  residual: true
  kernal_size: 5
  activation_function: 'ReLU'
  pooling_method: 'max'
  normalization: true

optimizer:
  lr: 0.00003
  step_size: 50
  gamma: 0.8

train:
  epochs: 100

logger:
  path: './log.txt'
  interval: 1

save:
  model: true
  interval: 10

load:
  reoptimization: false
  model: 'pretrained/r_plus_s_x2/model.pt'
  dataloader: 'pretrained/r_plus_s_x2/data.pkl'
